name: Refresh weather and gauges
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Fetch FloodSmart gauges and rain forecast
        run: python3 main/tools/fetch_weather.py site/data
      - name: Publish
        run: |
          cd site
          git config user.name "net-watch-bot"
          git config user.email "net-watch-bot@users.noreply.github.com"
          git add data/weather.json data/weather.js
          git diff --cached --quiet || (git commit -m "Refresh weather and gauges" && git push)
