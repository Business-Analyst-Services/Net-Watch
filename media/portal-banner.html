<!doctype html>
<html><head><meta charset="utf-8"><title>Net Watch portal banner</title>
<style>
:root{--navy:#1F3A5F;--deep:#14284A;--soft:#3E6189;--teal:#4DB8B8;--tint:#CDEDED;--orange:#F5A04A;--white:#fff;--slate:#A9B6C4;--ok:#3FA66B;--soon:#F5A04A;--now:#E2554A;--repair:#D2508A}
*{box-sizing:border-box}html,body{margin:0}
body{width:1456px;height:816px;font-family:Arial,Helvetica,"Liberation Sans",sans-serif;color:var(--white);
 background:radial-gradient(1100px 700px at 18% 12%,#2A4B75 0%,var(--navy) 42%,var(--deep) 100%);position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px}
.copy{position:absolute;left:88px;top:92px;width:760px}
.brand{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--teal)}
.brand::before{content:"";width:40px;height:3px;background:var(--teal)}
h1{margin:26px 0 0;font-size:132px;line-height:.95;font-weight:400;letter-spacing:-.02em}
h1 b{font-weight:700}
.sub{margin:30px 0 0;font-size:36px;line-height:1.25;font-weight:700;color:var(--white);max-width:640px}
.sub span{color:var(--orange)}
.tag{margin:26px 0 0;font-size:16px;letter-spacing:.22em;text-transform:uppercase;color:var(--slate)}
.flow{position:absolute;left:88px;bottom:96px;font-size:20px;color:var(--tint);display:flex;gap:14px;align-items:center}
.flow b{color:var(--white)}
.flow i{font-style:normal;color:var(--teal)}
.band{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--teal);color:var(--white);display:flex;justify-content:space-between;align-items:center;padding:0 88px;font-size:14px;font-weight:700;letter-spacing:.3em;text-transform:uppercase}
svg{position:absolute;right:0;top:0}
</style></head>
<body>
<div class="grid"></div>

 </g>
</svg>
<div class="copy">
 <div class="brand">GPT which GPT? · Team 101</div>
 <h1>Net <b>Watch</b></h1>

</div>
<div class="flow"><b>37 traps</b><i>·</i>camera frame + rain forecast<i>→</i>priority score<i>→</i>officer approves<i>→</i>work order</div>
<div class="band"><span>Human at every gate</span><span>WSTI Festi 2026</span></div>
</body></html>
