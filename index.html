<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Net Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#eef1f0;--card:#fff;--fg:#13222c;--muted:#61707a;--line:#d6dde0;--accent:#0f6b67;--accent-fg:#fff;--ink:#0f2f52;
--repair:#c03a6b;--now:#d2392f;--soon:#e58a10;--view:#5b6f7c;--ok:#2f8a58;--rain:#2a7fd4;--chip:#e6ecec;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0b1820;--card:#13242f;--fg:#edf1f1;--muted:#9fb1ba;--line:#24394a;--accent:#4fc2b8;--accent-fg:#0b1820;--ink:#d8e6f2;
--repair:#ec6f9c;--now:#f0675e;--soon:#f5ab3e;--view:#93a7b3;--ok:#6fc48f;--rain:#62a8ef;--chip:#1c3342;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.45 var(--sans)}
.app{max-width:1240px;margin:0 auto;padding:0 16px 40px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:16px 0 12px}
.brand{display:flex;align-items:baseline;gap:12px}
h1{margin:0;font-size:1.4rem;letter-spacing:-.01em}
.date{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.wx{display:flex;gap:8px;flex-wrap:wrap}
.wx span{background:var(--card);border:1px solid var(--line);padding:5px 10px;font-size:.84rem}
.wx b{font-variant-numeric:tabular-nums}
/* action tiles */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:12px}
.tile{position:relative;display:grid;gap:4px;align-content:start;text-align:left;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);padding:12px 14px;cursor:pointer;font:inherit;color:inherit;min-height:116px}
.tile:hover,.tile.on{box-shadow:0 0 0 2px var(--c) inset}
.tile .num{font-size:2.2rem;font-weight:700;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.tile .lbl{font-weight:600}
.tile .who{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.zero{opacity:.55}
.tile .go{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:.72rem;color:var(--c)}
/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);min-width:0}
.card h2{margin:0;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);font-weight:500}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pad{padding:12px 14px}
#map{height:430px;background:var(--chip)}
.tog{display:flex;gap:6px}
.tog button{background:var(--chip);border:1px solid var(--line);color:var(--fg);font:500 .78rem var(--sans);padding:4px 10px;cursor:pointer}
.tog button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 14px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.pin{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--pc)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.pin.pulse{animation:none}}
.leaflet-popup-content{font:13px/1.4 var(--sans);margin:10px 12px}
.leaflet-popup-content b{display:block;font-size:14px}
.leaflet-popup-content button{margin-top:6px}
/* charts */
svg text{font-family:var(--mono);fill:var(--muted)}
.chart{display:block;width:100%;height:auto}
.proj .row{display:grid;grid-template-columns:118px 1fr 108px;gap:8px;align-items:center;font-size:.84rem;padding:3px 0;cursor:pointer}
.proj .row:hover{background:var(--chip)}
.proj .bar{position:relative;height:14px;background:var(--chip)}
.proj .bar i{position:absolute;left:0;top:0;bottom:0}
.proj .bar u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--c) 0 3px,transparent 3px 6px);opacity:.6}
.proj .bar s{position:absolute;left:80%;top:-3px;bottom:-3px;border-left:2px dashed var(--fg);opacity:.5}
.proj .when{font-family:var(--mono);font-size:.76rem;text-align:right}
/* lane */
.lane{margin:12px 0}
.lane .hd{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c)}
.lane .hd b{font-size:1.05rem}
.fromemail{display:grid;gap:8px;background:var(--chip);border-left:5px solid var(--accent);padding:10px 12px;font-size:.9rem}
.fromemail .src{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.fromemail b{font-size:1rem}
.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent);color:var(--accent-fg);padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.banner button{background:none;border:1px solid currentColor;color:inherit;font:600 .8rem var(--sans);padding:4px 10px;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;margin-top:10px}
.nc{background:var(--card);border:1px solid var(--line);display:grid;grid-template-rows:auto 1fr}
.nc .ph{position:relative;aspect-ratio:4/3;background:#000;cursor:pointer;max-width:100%}
.nc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.nc .ph .badge{position:absolute;left:8px;top:8px;background:var(--c);color:#fff;font:600 .72rem var(--mono);padding:2px 7px}
.nc .ph .pscore{position:absolute;right:8px;top:8px;background:var(--b);color:#fff;font:700 .9rem var(--mono);padding:3px 8px}
.nc .ph .fillb{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(0,0,0,.4)}
.nc .ph .fillb i{display:block;height:100%;background:var(--c)}
.nc .bd{padding:10px 12px;display:grid;gap:6px;align-content:start}
.nc b{font-size:1rem}
.nc .why{font-size:.84rem;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--accent);background:none;color:var(--accent);padding:7px 11px;font:600 .84rem var(--sans);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.q{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.tile:focus-visible,.tog button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* work orders */
.wo{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);font-size:.88rem}
.wo:first-child{border-top:0}
.wo .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.wo .no{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.wo form{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.wo label{display:grid;gap:2px;font-size:.76rem;color:var(--muted)}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:6px 8px}
.empty{color:var(--muted);padding:16px 14px;font-size:.9rem}
.tl{display:grid;gap:0;padding:6px 14px 12px}
.tl .ev{display:grid;grid-template-columns:86px 14px 1fr auto;gap:8px;align-items:center;font-size:.84rem;padding:4px 0}
.tl .ev .d{font-family:var(--mono);font-size:.74rem;color:var(--muted)}
.tl .ev .k{width:10px;height:10px;border-radius:50%;background:var(--c)}
.tl .ev .kg{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(5,15,22,.55);display:flex;justify-content:flex-end;z-index:2000}
.drawer .in{background:var(--card);width:min(560px,100%);height:100%;overflow:auto;display:grid;align-content:start}
.drawer .fig{position:relative;background:#000;display:flex;justify-content:center}
.drawer .fig .fw{position:relative;max-width:100%}
.drawer .fig img{display:block;max-width:100%;max-height:360px}
.drawer .fig svg{position:absolute;inset:0;width:100%;height:100%}
.drawer .x{position:absolute;right:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;border:0;width:34px;height:34px;font-size:18px;cursor:pointer;z-index:2}
.gauge{display:flex;align-items:center;gap:14px}
.gauge svg{width:92px;height:92px;flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:.88rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
pre{margin:0;background:var(--chip);padding:10px;font:.8rem/1.5 var(--mono);white-space:pre-wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;font-size:.88rem;z-index:3000}
footer{margin-top:20px;font-family:var(--mono);font-size:.72rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
footer button,footer a{background:none;border:0;padding:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
/* roles */
.roles{display:flex;gap:4px;flex-wrap:wrap}
.roles button{background:var(--card);border:1px solid var(--line);color:var(--muted);font:600 .82rem var(--sans);padding:6px 12px;cursor:pointer}
.roles button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.rolehd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin:4px 0 12px}
.rolehd h2{margin:0;font-size:1.25rem;letter-spacing:0;text-transform:none;font-family:var(--sans);color:var(--fg)}
.rolehd span{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.jobs{display:grid;gap:10px}
.job{display:grid;grid-template-columns:44px 120px 1fr;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);padding:12px}
.job .stop{width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font:700 1rem var(--mono);display:flex;align-items:center;justify-content:center}
.job img{width:120px;height:90px;object-fit:cover;display:block}
.job b{font-size:1.05rem}.job .meta{font-size:.84rem;color:var(--muted)}
.job form{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:10px}
@media (max-width:560px){.job{grid-template-columns:36px 1fr}.job img{grid-column:1/-1;width:100%;height:160px}}
label.f{display:grid;gap:3px;font-size:.78rem;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.86rem;align-items:center}
.checks label{display:flex;gap:5px;align-items:center;color:var(--fg)}
.thumb{width:90px;height:68px;object-fit:cover;border:1px solid var(--line)}
.panel2{background:var(--card);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px}
.panel2 form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:6px 8px;min-height:64px;resize:vertical}
table.t{border-collapse:collapse;width:100%;font-size:.86rem}
table.t th{text-align:left;font:500 .72rem var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.chipc{display:inline-block;font:600 .72rem var(--mono);padding:2px 7px;color:#fff;background:var(--c)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);padding:12px 14px;display:grid;gap:2px}
.kpi b{font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi span{font-size:.84rem;color:var(--muted)}
.tblwrap{overflow-x:auto}
.jobsheet{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--chip);padding:8px 10px;font-size:.84rem}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><h1>Net Watch</h1><span class="date" id="date"></span></div>
 <nav class="roles" id="roles" aria-label="Switch user"></nav>
 <div class="wx" id="wx"></div>
</header>

<div id="vOfficer">
<div id="banner"></div>
<section class="actions" id="actions"></section>
<section class="lane" id="lane"></section>

<section class="grid">
 <div class="card">
  <div class="hd"><h2>Map</h2><div class="tog"><button id="tRadar">Rain radar</button><button id="tRun">Contractor run</button></div></div>
  <div id="map"></div>
  <div class="legend" id="legend"></div>
 </div>
 <div style="display:grid;gap:12px;align-content:start">
  <div class="card"><div class="hd"><h2>Rain, next 7 days</h2><span class="date" id="wxsrc"></span></div><div class="pad" id="rainchart"></div></div>
  <div class="card"><div class="hd"><h2>Priority ranking</h2><span class="date">50% condition · 25% rain · 15% criticality · 10% build-up</span></div><div class="pad proj" id="proj"></div></div>
 </div>
</section>

<section class="grid" style="margin-top:12px">
 <div class="card"><div class="hd"><h2>Open work orders</h2><div class="btns"><button class="btn q" id="copyRun">Copy run sheet</button></div></div><div id="wos"></div></div>
 <div class="card"><div class="hd"><h2>Work order history</h2><span class="date" id="kgtot"></span></div><div class="pad" id="histchart"></div><div class="tl" id="hist"></div></div>
</section>
</div>
<div id="vRole" hidden></div>

<footer><span>Demo data · approximate locations</span><span id="src2"></span><button id="reset">Reset demo</button><a href="email.html">Email alerts</a><a href="brief/">Brief</a></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- dates ---------- */
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const D=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const P=s=>new Date(s+'T00:00:00');
const fmt=(s,o)=>P(s).toLocaleDateString('en-AU',o).replace(',','');
const nice=s=>fmt(s,{weekday:'short',day:'numeric',month:'short'});
const short=s=>fmt(s,{weekday:'short',day:'numeric'});
const dmy=s=>fmt(s,{day:'numeric',month:'short',year:'2-digit'});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- demo nets (real SCADA thumbnails; locations approximate until Council supplies lat/longs) ---------- */
const SEED=[
 {id:'lackey-st-west',crit:1,critWhy:'Lake Parramatta catchment; 2022 audit: replace',load:'med',name:'Lackey St West',sub:'North Parramatta',ll:[-33.7962,151.0068],fill:45,mm:70,damaged:true,big:'img/lackey-st-west-full.jpg',mark:[57,52]},
 {id:'lackey-st-east',crit:1,critWhy:'Lake Parramatta catchment; 2022 audit: replace',load:'med',name:'Lackey St East',sub:'North Parramatta',ll:[-33.7953,151.0102],fill:58,mm:60},
 {id:'lake-parra-res',crit:1,critWhy:'Swimming lake downstream',load:'low',name:'Lake Parra Res',sub:'North Parramatta',ll:[-33.7905,151.0040],fill:20,mm:120},
 {id:'bettington-rd',crit:2,critWhy:'Creek reserve with public access',load:'med',name:'Bettington Rd',sub:'Oatlands',ll:[-33.7906,151.0305],fill:86,mm:90,big:'img/sim-net-blocked.jpg'},
 {id:'james-ruse-dr-1',crit:2,critWhy:'Arterial road catchment',load:'high',name:'James Ruse Dr 1',sub:'Northmead',ll:[-33.7985,151.0005],fill:76,mm:80,big:'img/sim-net-full.jpg'},
 {id:'james-ruse-dr-2',crit:2,critWhy:'Arterial road catchment',load:'high',name:'James Ruse Dr 2',sub:'Rosehill',ll:[-33.8205,151.0200],fill:30,mm:80},
 {id:'norwood-ave',crit:2,critWhy:'2022 audit: major work',load:'low',name:'Norwood Ave',sub:'Beecroft',ll:[-33.7530,151.0690],fill:62,mm:55,big:'img/sim-net-partial.jpg'},
 {id:'ridge-st',crit:3,critWhy:'Local street catchment',load:'low',name:'Ridge St',sub:'North Parramatta',ll:[-33.8010,151.0125],fill:null,mm:80,blind:3,big:'img/sim-net-unusable.jpg'},
 {id:'shirley-st',crit:3,critWhy:'Local street catchment',load:'med',name:'Shirley St',sub:'Carlingford',ll:[-33.7810,151.0480],fill:40,mm:110},
 {id:'anthony-st',crit:2,critWhy:'2022 audit: replace',load:'med',name:'Anthony St',sub:'Carlingford',ll:[-33.7840,151.0420],fill:25,mm:90},
 {id:'forest-cl',crit:3,critWhy:'Bushland creek',load:'low',name:'Forest Cl',sub:'Toongabbie Creek',ll:[-33.7870,150.9830],fill:15,mm:100},
 {id:'sturt-st',crit:3,critWhy:'Local street catchment',load:'low',name:'Sturt St',sub:'Telopea',ll:[-33.7935,151.0430],fill:10,mm:100,big:'img/sim-net-empty.jpg'},
 {id:'willmott-ave',crit:3,critWhy:'Bushland creek',load:'low',name:'Willmott Ave',sub:'Winston Hills',ll:[-33.7790,150.9880],fill:30,mm:120},
 {id:'charles-st',crit:1,critWhy:'Parramatta River at the CBD',load:'high',name:'Charles St',sub:'Parramatta River',ll:[-33.8150,151.0080],fill:15,mm:150}
];
const DEPOT={name:'Rydalmere Operations Centre',ll:[-33.8110,151.0330]};
function rnd(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;return()=>((h=(h*1103515245+12345)>>>0)%1000)/1000}
function seedHistory(n){const r=rnd(n.id),h=[];let day=-Math.round(20+r()*70);for(let i=0;i<5;i++){const repair=r()<.15;h.push({date:iso(D(day)),task:repair?'Repair net':'Empty net',kg:repair?0:Math.round(25+r()*n.mm*0.9),by:'Contractor'});day-=Math.round(70+r()*40)}return h}

/* ---------- state ---------- */
const KEY='netwatch-v4';let S;
function fresh(){const nets=SEED.map(n=>{const h=seedHistory(n);return{...n,hist:h,last:h[0].date}});
 const wos=[
  {no:'WO-26-0901',net:'sturt-st',site:'Sturt St',task:'Empty net',pri:'High',due:iso(D(0)),created:iso(D(-3)),reason:'72% full before rain',status:'Done',c:'--soon',job:{kg:48,result:'Emptied, net intact',defects:[],note:'Mostly leaves.',photo:'img/sim-net-empty.jpg',at:iso(D(-1))}},
  {no:'WO-26-0902',net:'willmott-ave',site:'Willmott Ave',task:'Inspect net and camera',pri:'Normal',due:iso(D(2)),created:iso(D(-1)),reason:'Camera angle moved',status:'Open',c:'--muted'}];
 const reports=[{no:'CRM-26-0412',net:'lake-parra-res',type:'Litter in the creek below the net',via:'Phone',details:'Plastic bottles caught on rocks downstream of the outlet.',date:iso(D(-1)),status:'New'}];
 return{nets,wos,reports,seq:1,crm:413}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.nets&&s.reports)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();

/* ---------- weather ---------- */
let RAIN={days:[0,1,2,3,4,5,6].map(i=>({d:iso(D(i)),mm:[0,2,5,26,9,1,0][i],p:[10,30,55,90,70,20,10][i]})),live:false};
async function getRain(){
 try{const ac=new AbortController();setTimeout(()=>ac.abort(),6000);
  const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.80&longitude=151.02&daily=precipitation_sum,precipitation_probability_max&timezone=Australia%2FSydney&forecast_days=7',{signal:ac.signal});
  const j=await r.json();RAIN={days:j.daily.time.map((d,i)=>({d,mm:Math.round(j.daily.precipitation_sum[i]||0),p:j.daily.precipitation_probability_max[i]||0})),live:true};show();
 }catch(e){}
}
const storm=()=>RAIN.days.slice(1).reduce((a,b)=>b.mm>a.mm?b:a);
const rain7=()=>RAIN.days.reduce((a,x)=>a+x.mm,0);

/* ---------- decision rules ---------- */
function project(n){ // fill per day over the forecast
 if(n.fill==null)return null;let f=n.fill;return RAIN.days.map(x=>(f=Math.min(100,f+x.mm/n.mm*100)))}
function hit80(n){const p=project(n);if(!p)return null;const i=p.findIndex(v=>v>=80);return i<0?null:RAIN.days[i].d}
function openWO(n){return S.wos.find(w=>w.net===n.id&&w.status!=='Closed')}
function openReport(n){return S.reports.find(r=>r.net===n.id&&r.status==='New')}
const B={
 repair:{lbl:'Repair torn nets',c:'--repair',task:'Repair or refit net',pri:'Urgent'},
 now:{lbl:'Empty full nets now',c:'--now',task:'Empty net',pri:'Urgent'},
 soon:{lbl:'Empty before the rain',c:'--soon',task:'Empty net',pri:'High'},
 report:{lbl:'Check resident reports',c:'--rain',task:'Inspect and clear litter',pri:'High'},
 view:{lbl:'Fix blocked cameras',c:'--view',task:'Clear camera view',pri:'Normal'},
};
function bucket(n){
 if(openWO(n))return'wo';
 if(n.defer&&n.defer>iso(TODAY))return'defer';
 if(n.damaged)return'repair';
 if(n.fill>=80)return'now';
 if(openReport(n))return'report';
 if(n.blind>=2)return'view';
 const h=hit80(n);if(h&&h<=iso(D(7)))return'soon';
 return'ok';
}
/* Priority score, 0-100: 50% current condition, 25% forecast weather, 15% asset criticality, 10% accumulation context */
const W8={c:.5,w:.25,k:.15,a:.1};
const rain3=()=>RAIN.days.slice(1,4).reduce((a,x)=>a+x.mm,0);
function score(n){
 const fill=n.fill==null?50:n.fill;
 const c=n.damaged?100:n.blind>=2?70:fill;                                  // condition: damaged 100, can't see 70, else fill %
 const cap=Math.max(1,(100-fill)/100*n.mm);                                 // mm of rain the net can still take
 const w=Math.min(100,Math.round(rain3()/cap*100));                          // forecast: 3-day rain against remaining capacity
 const k={1:100,2:60,3:30}[n.crit||3];                                      // criticality tier
 const days=Math.max(0,(TODAY-P(n.last))/864e5),ld={high:100,med:60,low:30}[n.load||'low'];
 const a=openReport(n)?100:Math.round(Math.min(100,days/90*100)*.6+ld*.4);  // accumulation: time since clean + catchment load; resident report = 100
 const total=Math.round(c*W8.c+w*W8.w+k*W8.k+a*W8.a);
 return{total,c:Math.round(c),w,k,a,cap:Math.round(cap),days:Math.round(days)};
}
const band=t=>t>=70?{l:'Act now',v:'--now'}:t>=50?{l:'This week',v:'--soon'}:t>=30?{l:'Watch',v:'--rain'}:{l:'Low',v:'--ok'};
function why(n){
 const b=bucket(n),h=hit80(n);
 if(b==='repair')return'Net torn or pulled off the pipe';
 if(b==='view')return`No clear image for ${n.blind} days`;
 if(b==='report'){const r=openReport(n);return`${r.no}: ${r.type}`}
 if(b==='now')return`${n.fill}% full · overflows in the next storm`;
 if(b==='soon')return`${n.fill}% now · hits 80% ${short(h)}`;
 if(b==='wo'){const w=openWO(n);return`${w.no} · ${w.status==='Done'?'awaiting sign-off':w.task}`}
 if(b==='defer')return`Deferred to ${nice(n.defer)}`;
 return n.fill==null?'No reading':`${n.fill}% full`;
}
const colOf=b=>({report:'--rain',repair:'--repair',now:'--now',soon:'--soon',view:'--view',wo:'--accent',defer:'--muted',ok:'--ok'}[b]);

/* ---------- map ---------- */
let map,markers={},radar=null,runLine=null;
function initMap(){
 if(!window.L){$('#map').innerHTML='<div class="empty">Map unavailable offline.</div>';return}
 map=L.map('map',{scrollWheelZoom:false}).setView([-33.795,151.02],12);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);
 L.marker(DEPOT.ll,{icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;background:#0f2f52;border:2px solid #fff;transform:rotate(45deg)"></div>',iconSize:[14,14]})}).addTo(map).bindTooltip('Depot · '+DEPOT.name);
}
function drawPins(){
 if(!map)return;
 Object.values(markers).forEach(m=>m.remove());markers={};
 S.nets.forEach(n=>{const b=bucket(n),c=cssv(colOf(b));
  const pulse=['repair','now'].includes(b)?' pulse':'';
  const m=L.marker(n.ll,{icon:L.divIcon({className:'',html:`<div class="pin${pulse}" style="background:${c};--pc:${c}"></div>`,iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);
  m.bindPopup(`<b>${esc(n.name)}</b>Priority ${score(n).total} · ${esc(why(n))}<br><button class="btn pri" data-open="${n.id}">Open</button>`);
  markers[n.id]=m;});
 $('#legend').innerHTML=[['repair','Repair'],['now','Empty now'],['soon','Before rain'],['report','Resident report'],['view',"Can't see"],['wo','Work order'],['ok','OK']].map(([b,l])=>`<span><i style="background:var(${colOf(b)})"></i>${l}</span>`).join('');
}
async function toggleRadar(){
 if(!map)return;
 if(radar){map.removeLayer(radar);radar=null;$('#tRadar').classList.remove('on');return}
 try{const ac=new AbortController();setTimeout(()=>ac.abort(),6000);
  const j=await (await fetch('https://api.rainviewer.com/public/weather-maps.json',{signal:ac.signal})).json();
  const f=j.radar.past[j.radar.past.length-1];
  radar=L.tileLayer(`${j.host}${f.path}/256/{z}/{x}/{y}/2/1_1.png`,{opacity:.65,maxNativeZoom:7,maxZoom:18,attribution:'Radar © RainViewer'}).addTo(map);
  $('#tRadar').classList.add('on');toast('Radar '+new Date(f.time*1000).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}));
 }catch(e){toast('Radar unavailable right now')}
}
function route(){ // nearest-neighbour run from the depot through open work orders
 const stops=S.wos.filter(w=>w.status==='Open').map(w=>S.nets.find(n=>n.id===w.net));
 const out=[];let cur=DEPOT.ll,left=[...stops];
 const dist=(a,b)=>Math.hypot(a[0]-b[0],(a[1]-b[1])*Math.cos(a[0]*Math.PI/180));
 while(left.length){left.sort((a,b)=>dist(cur,a.ll)-dist(cur,b.ll));const nx=left.shift();out.push(nx);cur=nx.ll}
 const km=out.reduce((a,n,i)=>a+dist(i?out[i-1].ll:DEPOT.ll,n.ll)*111,0)+(out.length?dist(out[out.length-1].ll,DEPOT.ll)*111:0);
 return{out,km:Math.round(km*1.4)};
}
function toggleRun(force){
 if(!map)return;
 if(runLine&&!force){runLine.remove();runLine=null;$('#tRun').classList.remove('on');return}
 if(runLine){runLine.remove();runLine=null}
 const {out}=route();if(!out.length){toast('No open work orders');$('#tRun').classList.remove('on');return}
 runLine=L.polyline([DEPOT.ll,...out.map(n=>n.ll),DEPOT.ll],{color:cssv('--accent'),weight:4,dashArray:'8 6'}).addTo(map);
 map.fitBounds(runLine.getBounds(),{padding:[30,30]});$('#tRun').classList.add('on');
}

/* ---------- render ---------- */
let lane=null,drawerId=null;
function render(){
 $('#date').textContent=nice(iso(TODAY));
 const st=storm();
 $('#wx').innerHTML=`<span>Today <b>${RAIN.days[0].mm} mm</b></span><span>Next 7 days <b>${rain7()} mm</b></span><span>Heaviest <b>${short(st.d)} · ${st.mm} mm</b></span>`;
 $('#wxsrc').textContent=RAIN.live?'Open-Meteo, live':'demo forecast';
 $('#src2').textContent=RAIN.live?'Rain: Open-Meteo':'Rain: demo values';
 // tiles
 const groups={};S.nets.slice().sort((x,y)=>score(y).total-score(x).total).forEach(n=>{const b=bucket(n);(groups[b]=groups[b]||[]).push(n)});
 const open=S.wos.filter(w=>w.status==='Open'),done=S.wos.filter(w=>w.status==='Done');
 $('#actions').innerHTML=Object.entries(B).map(([k,v])=>{const g=groups[k]||[];
  return`<button class="tile ${g.length?'':'zero'} ${lane===k?'on':''}" style="--c:var(${v.c})" data-lane="${k}"><span class="num">${g.length}</span><span class="lbl">${v.lbl}</span><span class="who">${g.length?esc(g.map(n=>n.name).join(', ')):'Nothing to do'}</span>${g.length?'<span class="go">Act →</span>':''}</button>`}).join('')+
  `<button class="tile ${open.length?'':'zero'}" style="--c:var(--accent)" data-scroll="wos"><span class="num">${open.length}</span><span class="lbl">With contractor</span><span class="who">${open.length?esc(open.map(w=>w.site).join(', ')):'No open work orders'}</span></button>`+
  `<button class="tile ${done.length?'':'zero'}" style="--c:var(--ok)" data-scroll="wos"><span class="num">${done.length}</span><span class="lbl">Sign off completed jobs</span><span class="who">${done.length?esc(done.map(w=>w.site).join(', ')):'Nothing to sign off'}</span>${done.length?'<span class="go">Act →</span>':''}</button>`;
 // lane
 if(lane&&(groups[lane]||[]).length){const v=B[lane],g=groups[lane];
  $('#lane').innerHTML=`<div class="hd" style="--c:var(${v.c})"><b>${v.lbl}</b><div class="btns"><button class="btn pri" data-raiseall="${lane}">Raise ${g.length} work order${g.length>1?'s':''}</button><button class="btn q" data-lane="${lane}">Close</button></div></div><div class="cards">${g.map(n=>ncard(n,v)).join('')}</div>`;
 }else{lane=null;$('#lane').innerHTML=''}
 drawPins();rainChart();projChart();wos();woHistory();
 if(drawerId)drawer(drawerId);
}
function img(n){return n.big||`img/${n.id}.jpg`}
function ncard(n,v){const f=n.fill??0;
 return`<div class="nc" style="--c:var(${v.c})"><div class="ph" data-open="${n.id}"><img src="${img(n)}" alt="${esc(n.name)} camera"><span class="badge">${n.fill==null?'NO VIEW':n.fill+'%'}</span><span class="pscore" style="--b:var(${band(score(n).total).v})">${score(n).total}</span><div class="fillb"><i style="width:${f}%"></i></div></div>
 <div class="bd"><b>${esc(n.name)}</b><span class="why">${esc(why(n))}</span><div class="btns"><button class="btn pri" data-raise="${n.id}">Raise work order</button><button class="btn" data-inspect="${n.id}">Inspect</button>${bucket(n)==='report'?`<button class="btn q" data-noaction="${n.id}">No action</button>`:`<button class="btn q" data-defer="${n.id}">Defer</button>`}</div></div></div>`}
function rainChart(){
 const W=360,H=150,pb=26,pt=16,max=Math.max(30,...RAIN.days.map(x=>x.mm)),bw=W/7;
 const bars=RAIN.days.map((x,i)=>{const h=(H-pb-pt)*x.mm/max,y=H-pb-h;
  return`<rect x="${i*bw+8}" y="${y}" width="${bw-16}" height="${Math.max(h,1)}" fill="var(--rain)" opacity="${.35+.65*x.p/100}"/><text x="${i*bw+bw/2}" y="${y-4}" text-anchor="middle" font-size="11" style="fill:var(--fg)">${x.mm}</text><text x="${i*bw+bw/2}" y="${H-8}" text-anchor="middle" font-size="10">${i?short(x.d).split(' ')[0]:'Today'}</text>`}).join('');
 $('#rainchart').innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rain forecast by day in millimetres">${bars}<line x1="0" x2="${W}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/></svg>`;
}
function projChart(){
 const L=S.nets.filter(n=>!openWO(n)).map(n=>({n,sc:score(n)})).sort((a,b)=>b.sc.total-a.sc.total).slice(0,9);
 const seg=(v,w,c)=>`<i style="position:relative;display:inline-block;height:100%;width:${v*w}%;background:var(${c})"></i>`;
 $('#proj').innerHTML=L.map(({n,sc})=>{const bd=band(sc.total);
  return`<div class="row" data-open="${n.id}"><span>${esc(n.name)}</span><div class="bar" style="display:flex">${seg(sc.c,W8.c,'--now')}${seg(sc.w,W8.w,'--rain')}${seg(sc.k,W8.k,'--ink')}${seg(sc.a,W8.a,'--soon')}</div><span class="when" style="color:var(${bd.v});font-weight:700">${sc.total} · ${bd.l}</span></div>`}).join('')+
 `<div class="legend" style="border:0;padding:8px 0 0"><span><i style="background:var(--now)"></i>Condition</span><span><i style="background:var(--rain)"></i>Rain forecast</span><span><i style="background:var(--ink)"></i>Criticality</span><span><i style="background:var(--soon)"></i>Build-up</span></div>`;
}
function wos(){
 const L=S.wos.filter(w=>w.status!=='Closed').sort((a,b)=>a.status==='Done'?-1:b.status==='Done'?1:0);
 $('#wos').innerHTML=L.length?L.map(w=>{
  if(w.status==='Done'){const j=w.job;
   return`<div class="wo" style="--c:var(--ok)"><span class="dot"></span><div><b>${esc(w.site)}</b> · ${esc(w.task)}<div class="no">${w.no} · done ${short(j.at)} · awaiting your sign-off</div></div><div class="btns"><button class="btn pri" data-signoff="${w.no}">Sign off</button><button class="btn q" data-sendback="${w.no}">Send back</button></div>
   <div class="jobsheet">${j.photo?`<img class="thumb" src="${j.photo}" alt="Contractor photo">`:''}<span><b>${esc(j.result)}</b>${j.kg?` · ${j.kg} kg`:''}${j.defects.length?` · Issues: ${esc(j.defects.join(', '))}`:''}${j.note?`<br>${esc(j.note)}`:''}</span></div></div>`}
  return`<div class="wo" style="--c:var(${w.c})"><span class="dot"></span><div><b>${esc(w.site)}</b> · ${esc(w.task)}<div class="no">${w.no} · ${w.pri} · due ${short(w.due)} · with contractor</div></div><span></span></div>`}).join(''):'<div class="empty">No open work orders. Raise one from an action above.</div>';
 $('#copyRun').disabled=!L.some(w=>w.status==='Open');
}
function months12(){const ev=[];S.nets.forEach(n=>n.hist.forEach(h=>ev.push(h)));
 const months=[...Array(12)].map((_,i)=>{const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-11+i,1);return{k:iso(d).slice(0,7),l:d.toLocaleDateString('en-AU',{month:'short'}).slice(0,1),kg:0,n:0}});
 ev.forEach(e=>{const m=months.find(m=>m.k===e.date.slice(0,7));if(m){m.kg+=e.kg;m.n++}});return months}
function kgSvg(months){const W=360,H=110,pb=20,max=Math.max(100,...months.map(m=>m.kg)),bw=W/12;
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilograms of litter removed per month">${months.map((m,i)=>{const h=(H-pb-10)*m.kg/max;return`<rect x="${i*bw+4}" y="${H-pb-h}" width="${bw-8}" height="${Math.max(h,1)}" fill="var(--accent)" opacity="${i===11?1:.7}"><title>${m.k}: ${m.kg} kg, ${m.n} jobs</title></rect><text x="${i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10">${m.l}</text>`}).join('')}</svg>`}
function woHistory(){
 const ev=[];S.nets.forEach(n=>n.hist.forEach(h=>ev.push({...h,site:n.name,id:n.id})));ev.sort((a,b)=>a.date<b.date?1:-1);
 // kg per month, last 12 months
 const months=[...Array(12)].map((_,i)=>{const d=new Date(TODAY.getFullYear(),TODAY.getMonth()-11+i,1);return{k:iso(d).slice(0,7),l:d.toLocaleDateString('en-AU',{month:'short'}).slice(0,1),kg:0,n:0}});
 ev.forEach(e=>{const m=months.find(m=>m.k===e.date.slice(0,7));if(m){m.kg+=e.kg;m.n++}});
 $('#histchart').innerHTML=kgSvg(months);

 const yr=months.reduce((a,m)=>a+m.kg,0);$('#kgtot').textContent=`${(yr/1000).toFixed(1)} t removed · 12 months`;
 $('#hist').innerHTML=ev.slice(0,8).map(e=>`<div class="ev" style="--c:var(${e.task.startsWith('Repair')?'--repair':e.task.startsWith('Clear')?'--view':e.task.startsWith('Inspect')?'--muted':'--accent'})" data-open="${e.id}"><span class="d">${dmy(e.date)}</span><span class="k"></span><span>${esc(e.site)} · ${esc(e.task)}</span><span class="kg">${e.kg?e.kg+' kg':''}</span></div>`).join('');
}
function gauge(f,c){const r=38,C=2*Math.PI*r,v=f==null?0:f;
 return`<svg viewBox="0 0 92 92"><circle cx="46" cy="46" r="${r}" fill="none" stroke="var(--chip)" stroke-width="9"/><circle cx="46" cy="46" r="${r}" fill="none" stroke="${c}" stroke-width="9" stroke-dasharray="${C*v/100} ${C}" transform="rotate(-90 46 46)"/><text x="46" y="52" text-anchor="middle" font-size="19" style="fill:var(--fg);font-weight:600">${f==null?'?':f+'%'}</text></svg>`}
function drawer(id){
 drawerId=id;const n=S.nets.find(x=>x.id===id),b=bucket(n),c=`var(${colOf(b)})`,p=project(n);
 const mark=n.mark&&n.damaged?`<svg viewBox="0 0 100 75" preserveAspectRatio="none"><ellipse cx="${n.mark[0]}" cy="${n.mark[1]}" rx="10" ry="13" fill="none" stroke="#ff3b3b" stroke-width=".9"/></svg>`:'';
 const act=['repair','now','soon','view','report'].includes(b);
 const pc=p?`<svg class="chart" viewBox="0 0 360 90" role="img" aria-label="Projected fill"><line x1="0" x2="360" y1="${80-80*.7}" y2="${80-80*.7}" stroke="var(--fg)" stroke-dasharray="4 4" opacity=".4"/><polyline fill="none" stroke="${c}" stroke-width="3" points="${[n.fill,...p].map((v,i)=>`${i*360/7},${80-v*.7}`).join(' ')}"/>${RAIN.days.map((x,i)=>`<text x="${(i+1)*360/7}" y="88" text-anchor="end" font-size="9">${short(x.d).split(' ')[0]}</text>`).join('')}</svg>`:'';
 let el=$('.drawer');if(!el){el=document.createElement('div');el.className='drawer';document.body.appendChild(el)}
 el.innerHTML=`<div class="in" role="dialog" aria-label="${esc(n.name)}"><div class="fig"><button class="x" data-close aria-label="Close">×</button><div class="fw"><img src="${img(n)}" alt="Latest camera image, ${esc(n.name)}">${mark}</div></div>
 <div class="pad" style="display:grid;gap:12px">${EMAIL&&EMAIL.net===n.id&&!EMAIL.done?emailBlock(n):""}
  <div class="gauge">${gauge(n.fill,c)}<div><div style="font-size:1.2rem;font-weight:700">${esc(n.name)}</div><div style="color:var(--muted);font-size:.86rem">${esc(n.sub)}</div><div style="color:${c};font-weight:600;margin-top:4px">${esc(why(n))}</div></div></div>
  ${act&&!(EMAIL&&EMAIL.net===n.id&&!EMAIL.done)?`<div class="btns"><button class="btn pri" data-raise="${n.id}">Raise work order</button><button class="btn" data-inspect="${n.id}">Inspect</button><button class="btn q" data-defer="${n.id}">Defer 7 days</button></div>`:''}
  <div id="wo-out"></div>
  ${scoreBlock(n)}
  ${pc?`<div><div class="date" style="margin-bottom:4px">FILL FORECAST · 80% LINE</div>${pc}</div>`:''}
  <dl class="kv"><dt>Holds</dt><dd>${n.fill==null?'—':'~'+Math.round((100-n.fill)/100*n.mm)+' mm more rain'}</dd><dt>Fills in</dt><dd>~${n.mm} mm of rain from empty</dd><dt>Last cleaned</dt><dd>${nice(n.last)}</dd></dl>
  <div><div class="date" style="margin-bottom:4px">HISTORY</div><div class="tl" style="padding:0">${n.hist.map(e=>`<div class="ev" style="--c:var(${e.task.startsWith('Repair')?'--repair':'--accent'})"><span class="d">${dmy(e.date)}</span><span class="k"></span><span>${esc(e.task)}</span><span class="kg">${e.kg?e.kg+' kg':''}</span></div>`).join('')}</div></div>
 </div></div>`;
}
function scoreBlock(n){const sc=score(n),bd=band(sc.total);
 const row=(l,v,w,c,d)=>`<div style="display:grid;grid-template-columns:150px 1fr 44px;gap:8px;align-items:center;font-size:.84rem"><span>${l} <span style="color:var(--muted)">${w*100}%</span></span><div style="height:10px;background:var(--chip)"><div style="height:100%;width:${v}%;background:var(${c})"></div></div><span style="font-family:var(--mono);text-align:right">${v}</span><span style="grid-column:1/-1;color:var(--muted);font-size:.78rem;margin-top:-4px">${d}</span></div>`;
 return`<div style="display:grid;gap:8px;border:1px solid var(--line);padding:10px 12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="date">PRIORITY SCORE</span><b style="font-size:1.4rem;color:var(${bd.v})">${sc.total} <span style="font-size:.85rem">${bd.l}</span></b></div>
 ${row('Current condition',sc.c,W8.c,'--now',n.damaged?'Net torn or off the pipe':n.blind>=2?'No clear image: unknown state is a risk':`${n.fill}% full`)}
 ${row('Forecast rain',sc.w,W8.w,'--rain',`${rain3()} mm in 3 days vs ~${sc.cap} mm it can still hold`)}
 ${row('Asset criticality',sc.k,W8.k,'--ink',`Tier ${n.crit}: ${esc(n.critWhy)}`)}
 ${row('Build-up context',sc.a,W8.a,'--soon',openReport(n)?'Resident report open':`${sc.days} days since clean · ${n.load==='med'?'medium':n.load} litter catchment`)}</div>`}
function closeDrawer(){drawerId=null;const el=$('.drawer');if(el)el.remove()}

/* ---------- arriving from an email ---------- */
let EMAIL=null;
const ACTLBL={raise:'Raise work order',inspect:'Send inspector',defer:'Defer 7 days'};
function emailBlock(n){const a=EMAIL.do||'raise',b=bucket(n),task=a==='inspect'?'Inspect net and camera':(B[b]||B.soon).task;
 if(!['repair','now','soon','view','report'].includes(b)&&a!=='inspect')return`<div class="fromemail"><span class="src">OPENED FROM EMAIL ALERT</span><b>Already actioned</b><span>${esc(why(n))}</span></div>`;
 return`<div class="fromemail"><span class="src">OPENED FROM EMAIL ALERT</span><b>${a==='defer'?'Defer this net for 7 days?':`Confirm: ${esc(task)}`}</b><span>${esc(why(n))}</span><div class="btns"><button class="btn pri" data-confirm="${a}">${a==='defer'?'Confirm defer':'Confirm and raise'}</button><button class="btn q" data-close>Not now</button></div></div>`}
function fromEmail(){
 const q=new URLSearchParams(location.search),net=q.get('net'),act=q.get('do'),ln=q.get('lane');
 if(ln&&B[ln]){lane=ln;$('#banner').innerHTML=`<div class="banner"><span>Opened from email: ${esc(B[ln].lbl.toLowerCase())}. Review the nets below, then raise the work orders.</span><button data-dismiss>Dismiss</button></div>`;render();$('#lane').scrollIntoView({block:'start'})}
 if(net&&S.nets.find(n=>n.id===net)){EMAIL={net,do:act&&ACTLBL[act]?act:'raise'};drawer(net)}
 if(net||ln)history.replaceState(null,'',location.pathname);
}

/* ---------- actions ---------- */
function raise(id,kind){
 const n=S.nets.find(x=>x.id===id),b=bucket(n);if(openWO(n))return null;
 const linked=S.reports.filter(r=>r.net===id&&r.status==='New');
 const v=B[b]||B.soon,no='WO-'+String(TODAY.getFullYear()).slice(2)+'-'+String(S.seq++).padStart(4,'0');
 const task=kind==='inspect'?'Inspect net and camera':v.task;
 let due=iso(D(2));if(b==='soon'){const h=P(hit80(n));h.setDate(h.getDate()-1);due=iso(h<D(1)?D(1):h)}
 const w={no,net:id,site:n.name,task,pri:kind==='inspect'?'Normal':v.pri,due,created:iso(TODAY),reason:why(n),status:'Open',c:kind==='inspect'?'--muted':v.c};
 S.wos.push(w);linked.forEach(r=>{r.status='With contractor';r.wo=no});save();return w;
}
function woText(w){return`${w.no} · ${w.site} · ${w.task} · ${w.pri} · by ${nice(w.due)} · ${w.reason}`}
function runSheet(){const {out,km}=route();return`CONTRACTOR RUN · ${nice(iso(TODAY))} · ~${km} km\nStart: ${DEPOT.name}\n`+out.map((n,i)=>{const w=openWO(n);return`${i+1}. ${n.name} (${n.sub}) · ${w.task} · ${w.pri} · ${w.no}`}).join('\n')+`\nReturn: ${DEPOT.name}`}
/* ---------- sign-off (officer) ---------- */
function signoff(no){
 const w=S.wos.find(x=>x.no===no),n=S.nets.find(x=>x.id===w.net),j=w.job,st=j.result;
 if(st==='Emptied, net intact'||st==='Repaired or replaced'){n.fill=5;n.damaged=false;n.last=j.at;if(n.big&&n.big.includes('sim-net'))n.big='img/sim-net-empty.jpg'}
 if(st==='Repaired or replaced'&&n.big&&n.big.includes('lackey'))n.big=null;
 if(st==='Camera view cleared'){n.blind=0;if(n.fill==null)n.fill=35;n.big=null}
 if(j.defects.includes('Net damaged'))n.damaged=true;
 if(j.defects.includes('Camera blocked'))n.blind=Math.max(n.blind||0,2);
 n.hist.unshift({date:j.at,task:st,kg:j.kg,by:'Contractor'});
 w.status='Closed';w.closed=iso(TODAY);
 S.reports.filter(r=>r.wo===no).forEach(r=>r.status='Resolved');
 save();render();if(runLine)toggleRun(true);toast(no+' signed off and closed');
}

/* ---------- roles ---------- */
const ROLES=[['officer','Stormwater officer'],['contractor','Contractor'],['cs','Customer service'],['manager','Manager']];
let ROLE=(()=>{const q=new URLSearchParams(location.search).get('role');if(q&&ROLES.some(r=>r[0]===q))return q;try{return localStorage.getItem('netwatch-role')||'officer'}catch(e){return'officer'}})();
let PHOTO={};
function setRole(r){ROLE=r;try{localStorage.setItem('netwatch-role',r)}catch(e){}closeDrawer();show()}
function show(){
 $('#roles').innerHTML=ROLES.map(([k,l])=>`<button class="${ROLE===k?'on':''}" data-role="${k}">${l}</button>`).join('');
 const off=ROLE==='officer';$('#vOfficer').hidden=!off;$('#vRole').hidden=off;
 if(off){render();if(map)setTimeout(()=>map.invalidateSize(),50)}
 else $('#vRole').innerHTML=ROLE==='contractor'?vContractor():ROLE==='cs'?vCS():vManager();
}
const RESULTS=['Emptied, net intact','Repaired or replaced','Camera view cleared','Inspected, no action'];
function vContractor(){
 const {out,km}=route(),done=S.wos.filter(w=>w.status==='Done');
 const jobs=out.map((n,i)=>{const w=openWO(n),b=w.c||'--accent';
  return`<div class="job" style="--c:var(${b})"><span class="stop">${i+1}</span><img src="${img(n)}" alt="${esc(n.name)} camera">
  <div style="display:grid;gap:4px"><b>${esc(n.name)}</b><span class="meta">${esc(n.sub)} · ${w.no}</span><span>${esc(w.task)} · <b>${w.pri}</b> · by ${short(w.due)}</span><span class="meta">${esc(w.reason)}</span>
  <div class="btns"><a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${n.ll[0]},${n.ll[1]}" target="_blank" rel="noopener">Directions</a><button class="btn pri" data-jobform="${w.no}">Complete job</button></div></div>
  <div id="jf-${w.no}" style="display:contents"></div></div>`}).join('');
 return`<div class="rolehd"><h2>Today's run</h2><span>Urban Asset Solutions · ${out.length} job${out.length===1?'':'s'} · ~${km} km from ${esc(DEPOT.name)}</span></div>
 <div class="jobs">${jobs||'<div class="empty">No jobs. Council has not raised any work orders.</div>'}</div>
 <div class="rolehd" style="margin-top:20px"><h2>Waiting for Council sign-off</h2><span>${done.length}</span></div>
 <div class="card">${done.length?done.map(w=>`<div class="wo" style="--c:var(--ok)"><span class="dot"></span><div><b>${esc(w.site)}</b> · ${esc(w.job.result)}${w.job.kg?` · ${w.job.kg} kg`:''}<div class="no">${w.no} · sent ${short(w.job.at)}</div></div><span></span></div>`).join(''):'<div class="empty">Nothing waiting.</div>'}</div>`;
}
function jobForm(no){
 const w=S.wos.find(x=>x.no===no);
 $('#jf-'+no).innerHTML=`<form data-job="${no}">
  <label class="f">Result<select name="result">${RESULTS.map(r=>`<option${w.task.startsWith('Repair')&&r.startsWith('Repaired')||w.task.startsWith('Clear')&&r.startsWith('Camera')||w.task.startsWith('Inspect')&&r.startsWith('Inspected')?' selected':''}>${r}</option>`).join('')}</select></label>
  <label class="f">Removed (kg)<input name="kg" type="number" min="0" step="1" value="${w.task.startsWith('Empty')?60:0}"></label>
  <label class="f">Photo after<input name="photo" type="file" accept="image/*" capture="environment" data-photo="${no}"></label>
  <div class="checks"><span style="color:var(--muted);font-size:.78rem">Issues found</span>${['Net damaged','Camera blocked','Access problem'].map(x=>`<label><input type="checkbox" name="def" value="${x}">${x}</label>`).join('')}</div>
  <label class="f" style="grid-column:1/-1">Note<input name="note" placeholder="Optional"></label>
  <div class="btns"><button class="btn pri">Send to Council</button></div></form>`;
}
function vCS(){
 const opts=S.nets.map(n=>`<option value="${n.id}">${esc(n.name)} (${esc(n.sub)})</option>`).join('');
 const rows=S.reports.slice().reverse().map(r=>{const n=S.nets.find(x=>x.id===r.net),c={New:'--soon','With contractor':'--accent',Resolved:'--ok','Closed, no action':'--muted'}[r.status]||'--muted';
  return`<tr><td class="n">${r.no}</td><td>${short(r.date)}</td><td>${esc(n.name)}</td><td>${esc(r.type)}<div style="color:var(--muted);font-size:.8rem">${esc(r.details||'')}</div></td><td><span class="chipc" style="--c:var(${c})">${r.status}</span>${r.wo?`<div class="no" style="font-family:var(--mono);font-size:.74rem;color:var(--muted)">${r.wo}</div>`:''}</td></tr>`}).join('');
 return`<div class="rolehd"><h2>Log a resident report</h2><span>Goes straight to the stormwater officer</span></div>
 <div class="panel2"><form data-report>
  <label class="f">Where<select name="net">${opts}</select></label>
  <label class="f">What<select name="type"><option>Litter in the creek below the net</option><option>Net looks torn or loose</option><option>Flooding or ponding near the pipe</option><option>Bad smell</option><option>Other</option></select></label>
  <label class="f">How reported<select name="via"><option>Phone</option><option>Online form</option><option>Email</option><option>Front counter</option></select></label>
  <label class="f" style="grid-column:1/-1">Details<textarea name="details" placeholder="What the resident saw. Do not record names or contact details."></textarea></label>
  <div class="btns"><button class="btn pri">Log report</button></div></form></div>
 <div class="rolehd"><h2>Reports</h2><span>${S.reports.filter(r=>r.status!=='Resolved'&&r.status!=='Closed, no action').length} open</span></div>
 <div class="card tblwrap"><table class="t"><tr><th>Ref</th><th>Logged</th><th>Where</th><th>What</th><th>Status</th></tr>${rows||'<tr><td colspan="5">No reports yet.</td></tr>'}</table></div>`;
}
function vManager(){
 const act=S.nets.filter(n=>['repair','now','soon','view','report'].includes(bucket(n))).length;
 const live=S.nets.filter(n=>!(n.blind>=2)).length;
 const openW=S.wos.filter(w=>w.status!=='Closed').length,overdue=S.wos.filter(w=>w.status==='Open'&&w.due<iso(TODAY)).length;
 const timed=S.wos.filter(w=>w.job&&w.created).map(w=>(P(w.job.at)-P(w.created))/864e5);
 const avg=timed.length?(timed.reduce((a,b)=>a+b,0)/timed.length).toFixed(1):'—';
 const m=months12(),t=(m.reduce((a,x)=>a+x.kg,0)/1000).toFixed(1);
 const avoided=S.nets.filter(n=>bucket(n)==='ok'&&n.fill!=null&&n.fill<40).length;
 const repOpen=S.reports.filter(r=>r.status==='New'||r.status==='With contractor').length;
 const yr=iso(D(-365));
 const rows=S.nets.slice().sort((x,y)=>score(y).total-score(x).total).map(n=>{const b=bucket(n),h=n.hist.filter(e=>e.date>=yr),kg=h.reduce((a,e)=>a+e.kg,0),sc=score(n).total;
  const lbl={repair:'Repair',now:'Empty now',soon:'Before rain',view:"Can't see",report:'Resident report',wo:'Work order',defer:'Deferred',ok:'OK'}[b];
  return`<tr data-open="${n.id}" style="cursor:pointer"><td>${esc(n.name)}</td><td class="n" style="color:var(${band(sc).v});font-weight:700">${sc}</td><td><span class="chipc" style="--c:var(${colOf(b)})">${lbl}</span></td><td class="n">${n.fill==null?'?':n.fill+'%'}</td><td>${dmy(n.last)}</td><td class="n">${h.length}</td><td class="n">${kg}</td></tr>`}).join('');
 return`<div class="rolehd"><h2>Network overview</h2><span>${nice(iso(TODAY))}</span></div>
 <div class="kpis">
  <div class="kpi"><b>${live}/${S.nets.length}</b><span>Nets with a clear camera view</span></div>
  <div class="kpi"><b>${act}</b><span>Nets needing action now</span></div>
  <div class="kpi"><b>${openW}</b><span>Open work orders${overdue?` · ${overdue} overdue`:''}</span></div>
  <div class="kpi"><b>${avg}</b><span>Days from raise to done (avg)</span></div>
  <div class="kpi"><b>${t} t</b><span>Litter removed, 12 months</span></div>
  <div class="kpi"><b>${avoided}</b><span>Quarterly visits not needed (under 40% full) · ~$${(avoided*1390).toLocaleString('en-AU')} est.</span></div>
  <div class="kpi"><b>${repOpen}</b><span>Resident reports open</span></div>
 </div>
 <div class="grid">
  <div class="card tblwrap"><div class="hd"><h2>Every net</h2></div><table class="t"><tr><th>Net</th><th style="text-align:right">Priority</th><th>Status</th><th style="text-align:right">Fill</th><th>Last cleaned</th><th style="text-align:right">Cleans 12m</th><th style="text-align:right">kg 12m</th></tr>${rows}</table></div>
  <div class="card"><div class="hd"><h2>Litter removed per month</h2></div><div class="pad">${kgSvg(m)}</div></div>
 </div>`;
}
function photoIn(input){
 const f=input.files&&input.files[0];if(!f)return;const no=input.dataset.photo,r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);PHOTO[no]=c.toDataURL('image/jpeg',.7);toast('Photo added')};im.src=r.result};r.readAsDataURL(f);
}

function copy(t,msg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg)).catch(()=>toast('Copy blocked: select the text instead'))}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2400)}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-lane],[data-open],[data-raise],[data-raiseall],[data-inspect],[data-defer],[data-close],[data-scroll],[data-confirm],[data-dismiss],[data-role],[data-signoff],[data-sendback],[data-noaction],[data-jobform]');
 if(!t){if(e.target.classList.contains('drawer'))closeDrawer();return}
 const d=t.dataset;
 if(d.role){setRole(d.role)}
 else if(d.lane){lane=lane===d.lane?null:d.lane;render();if(lane)$('#lane').scrollIntoView({behavior:'smooth',block:'start'})}
 else if(d.scroll){$('#'+d.scroll).scrollIntoView({behavior:'smooth',block:'center'})}
 else if(d.open){map&&map.closePopup();drawer(d.open)}
 else if('close' in d)closeDrawer();
 else if(d.raise||d.inspect){const w=raise(d.raise||d.inspect,d.inspect?'inspect':'');if(w){render();toast(`${w.no} raised · ${w.site}`);if(drawerId)$('#wo-out').innerHTML=`<pre>${esc(woText(w))}</pre>`;if(runLine)toggleRun(true)}}
 else if(d.raiseall){const g=S.nets.filter(n=>bucket(n)===d.raiseall);g.forEach(n=>raise(n.id));lane=null;render();toast(`${g.length} work orders raised`);if(runLine)toggleRun(true)}
 else if(d.defer){S.nets.find(x=>x.id===d.defer).defer=iso(D(7));save();closeDrawer();render();toast('Deferred 7 days')}
 else if(d.noaction){S.reports.filter(r=>r.net===d.noaction&&r.status==='New').forEach(r=>r.status='Closed, no action');save();closeDrawer();render();toast('Report closed, no action')}
 else if(d.signoff)signoff(d.signoff);
 else if(d.sendback){const w=S.wos.find(x=>x.no===d.sendback);w.status='Open';w.reason='Sent back: '+(w.job.note||'see Council');w.job=null;save();render();toast(w.no+' sent back to contractor')}
 else if(d.jobform)jobForm(d.jobform);
 else if(d.confirm){const id=EMAIL.net;EMAIL.done=true;
  if(d.confirm==='defer'){S.nets.find(x=>x.id===id).defer=iso(D(7));save();closeDrawer();render();toast('Deferred 7 days')}
  else{const w=raise(id,d.confirm==='inspect'?'inspect':'');render();if(w){toast(`${w.no} raised · ${w.site}`);$('#wo-out').innerHTML=`<pre>${esc(woText(w))}</pre>`}}}
 else if('dismiss' in d){$('#banner').innerHTML=''}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.photo)photoIn(e.target)});
document.addEventListener('submit',e=>{
 const f=e.target;
 if(f.dataset.job!==undefined){e.preventDefault();const no=f.dataset.job,w=S.wos.find(x=>x.no===no),fd=new FormData(f);
  w.job={result:fd.get('result'),kg:+fd.get('kg')||0,defects:fd.getAll('def'),note:fd.get('note')||'',photo:PHOTO[no]||null,at:iso(TODAY)};w.status='Done';delete PHOTO[no];
  save();show();toast(`${no} sent to Council for sign-off`)}
 else if(f.dataset.report!==undefined){e.preventDefault();const fd=new FormData(f),no='CRM-'+String(TODAY.getFullYear()).slice(2)+'-'+String(S.crm++).padStart(4,'0');
  S.reports.push({no,net:fd.get('net'),type:fd.get('type'),via:fd.get('via'),details:(fd.get('details')||'').slice(0,400),date:iso(TODAY),status:'New'});
  save();show();toast(`${no} logged and sent to the stormwater officer`)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
$('#tRadar').onclick=toggleRadar;$('#tRun').onclick=()=>toggleRun();
$('#copyRun').onclick=()=>copy(runSheet(),'Run sheet copied');
$('#reset').onclick=()=>{S=fresh();save();lane=null;closeDrawer();if(runLine){runLine.remove();runLine=null;$('#tRun').classList.remove('on')}show();toast('Demo reset')};
initMap();if(new URLSearchParams(location.search).has('net')||new URLSearchParams(location.search).has('lane'))ROLE='officer';show();fromEmail();getRain();
</script>
</body>
</html>
