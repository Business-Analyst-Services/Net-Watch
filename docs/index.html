<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Net Watch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f2ed;--card:#fff;--fg:#15232d;--muted:#63717a;--line:#dcd7cc;--accent:#126a6a;--accent-fg:#fff;
--l3:#c63d3d;--l2:#d98a12;--l1:#2f8a58;--l0:#8fa3ad;--chip:#ece8df;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0e1d28;--card:#16293a;--fg:#eef0ee;--muted:#a3b4bd;--line:#284256;--accent:#5fc2b6;--accent-fg:#0e1d28;--l3:#f07272;--l2:#f2b14a;--l1:#6fc48f;--l0:#7f939d;--chip:#203a4f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
.app{max-width:760px;margin:0 auto;padding:0 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;padding:18px 0 10px}
h1{margin:0;font-size:1.35rem}
.rain{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.rain b{color:var(--fg);font-weight:500}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:500 .92rem var(--sans);color:var(--muted);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--fg);border-color:var(--accent)}
nav .n{font-family:var(--mono);font-size:.78rem;margin-left:4px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--l0);padding:8px 12px 8px 8px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.item:hover{border-color:var(--accent)}
.item img{width:64px;height:64px;object-fit:cover;display:block}
.item b{display:block;font-weight:600}
.item span{color:var(--muted);font-size:.86rem}
.item .act{font-family:var(--mono);font-size:.76rem;font-weight:500;white-space:nowrap}
.lv3{border-left-color:var(--l3)}.lv3 .act{color:var(--l3)}
.lv2{border-left-color:var(--l2)}.lv2 .act{color:var(--l2)}
.lv1{border-left-color:var(--l1)}.lv1 .act{color:var(--l1)}
.empty{color:var(--muted);padding:28px 0;text-align:center}
.sheet{background:var(--card);border:1px solid var(--line);margin-bottom:16px}
.fig{background:#000;display:flex;justify-content:center}
.fig .fw{position:relative;max-width:100%}
.fig img{display:block;max-width:100%;max-height:420px;width:auto;height:auto}
.fig svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.body{padding:14px 16px;display:grid;gap:12px}
.ttl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ttl h2{margin:0;font-size:1.15rem}
.tag{font-family:var(--mono);font-size:.74rem;padding:2px 8px;color:#fff;background:var(--l0)}
.tag.lv3{background:var(--l3)}.tag.lv2{background:var(--l2)}.tag.lv1{background:var(--l1)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0;font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--chip);margin-top:6px}.meter i{display:block;height:100%;background:var(--l2)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--accent);background:none;color:var(--accent);padding:9px 14px;font:600 .9rem var(--sans);cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.btn:focus-visible,nav button:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.back{background:none;border:0;color:var(--accent);font:500 .9rem var(--sans);padding:0 0 10px;cursor:pointer}
pre{margin:0;background:var(--chip);padding:12px;font:.84rem/1.5 var(--mono);white-space:pre-wrap;overflow-x:auto}
.form{display:grid;gap:10px}
label{display:grid;gap:4px;font-size:.86rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:8px}
.wo{background:var(--card);border:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.wo .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wo .no{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
footer{margin-top:28px;font-family:var(--mono);font-size:.74rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
footer button,footer a{background:none;border:0;padding:0;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;font-size:.88rem}
@media (max-width:480px){.item{grid-template-columns:52px 1fr}.item img{width:52px;height:52px}.item .act{grid-column:2}}
</style>
</head>
<body>
<div class="app">
<header><h1>Net Watch</h1><div class="rain" id="rain">Rain forecast loading…</div></header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer><span>Demo data</span><span id="src"></span><button id="reset">Reset demo</button><a href="brief/">Brief</a></footer>
</div>
<div class="toast" id="toast" hidden></div>
<script>
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const D=n=>{const d=new Date(TODAY);d.setDate(d.getDate()+n);return d};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const P=s=>new Date(s+'T00:00:00');
const nice=s=>new Date(s+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}).replace(',','');
const short=s=>new Date(s+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric'}).replace(',','');

// Demo nets: real SCADA thumbnails; large frames are the real Lackey St West image or simulated states.
const SEED=[
 {id:'lackey-st-west',name:'Lackey St West',fill:45,mm:70,last:iso(D(-85)),damaged:true,big:'img/lackey-st-west-full.jpg',mark:[57,52]},
 {id:'bettington-rd',name:'Bettington Rd',fill:86,mm:90,last:iso(D(-120)),big:'img/sim-net-blocked.jpg'},
 {id:'james-ruse-dr-1',name:'James Ruse Dr 1',fill:76,mm:80,last:iso(D(-95)),big:'img/sim-net-full.jpg'},
 {id:'norwood-ave',name:'Norwood Ave',fill:62,mm:55,last:iso(D(-70)),big:'img/sim-net-partial.jpg'},
 {id:'ridge-st',name:'Ridge St',fill:null,mm:80,last:iso(D(-60)),blind:3,big:'img/sim-net-unusable.jpg'},
 {id:'lackey-st-east',name:'Lackey St East',fill:35,mm:90,last:iso(D(-40))},
 {id:'lake-parra-res',name:'Lake Parra Res',fill:20,mm:120,last:iso(D(-30))},
 {id:'forest-cl',name:'Forest Cl',fill:15,mm:100,last:iso(D(-20))},
 {id:'james-ruse-dr-2',name:'James Ruse Dr 2',fill:30,mm:80,last:iso(D(-50))},
 {id:'shirley-st',name:'Shirley St',fill:40,mm:110,last:iso(D(-65))},
 {id:'anthony-st',name:'Anthony St',fill:25,mm:90,last:iso(D(-45))},
 {id:'sturt-st',name:'Sturt St',fill:10,mm:100,last:iso(D(-12)),big:'img/sim-net-empty.jpg'},
 {id:'willmott-ave',name:'Willmott Ave',fill:30,mm:120,last:iso(D(-55))},
 {id:'charles-st',name:'Charles St',fill:15,mm:150,last:iso(D(-25))}
];
const KEY='netwatch-v1';
let S;
function fresh(){return{nets:SEED.map(n=>({...n})),wos:[],log:[],seq:1}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.nets)return s}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();

// Rain: Open-Meteo daily totals for Parramatta, next 3 days. Falls back to a demo storm.
let RAIN={days:[{d:iso(D(1)),mm:2},{d:iso(D(2)),mm:6},{d:iso(D(3)),mm:28}],live:false};
const rainTotal=()=>RAIN.days.reduce((a,x)=>a+x.mm,0);
const stormDay=()=>{const x=RAIN.days.find(x=>x.mm>=10)||RAIN.days.reduce((a,b)=>b.mm>a.mm?b:a);return x};
async function getRain(){
 try{const ac=new AbortController();setTimeout(()=>ac.abort(),6000);const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=-33.815&longitude=151.003&daily=precipitation_sum&timezone=Australia%2FSydney&forecast_days=4',{signal:ac.signal});
  const j=await r.json();const t=j.daily.time,p=j.daily.precipitation_sum;
  RAIN={days:t.slice(1,4).map((d,i)=>({d,mm:Math.round(p[i+1]||0)})),live:true};
 }catch(e){}
 render();
}

function assess(n){
 const open=S.wos.find(w=>w.net===n.id&&w.status==='Open');
 if(open)return{lv:0,act:'Work order '+open.no,why:open.task,state:'With contractor'};
 if(n.defer&&n.defer>iso(TODAY))return{lv:0,act:'Deferred to '+nice(n.defer),why:'',state:'Deferred'};
 const cap0=n.fill==null?null:Math.round((100-n.fill)/100*n.mm);
 if(n.damaged)return{lv:3,act:'Repair',task:'Repair or refit net',why:'Net torn or off the pipe',state:'Damaged',cap:cap0};
 if(n.blind>=2)return{lv:2,act:'Restore view',task:'Clear camera view',why:`No clear image for ${n.blind} days`,state:"Can't see"};
 const cap=Math.round((100-n.fill)/100*n.mm),s=stormDay(),tot=rainTotal();
 if(n.fill>=80)return{lv:3,act:'Clean now',task:'Empty net',why:`${n.fill}% full`,state:'Overdue',cap};
 if(n.fill>=70||tot>=cap)return{lv:2,act:'Clean by '+short(s.d),task:'Empty net',why:`${n.fill}% full · holds ~${cap} mm more · ${tot} mm forecast`,state:'Clean due',cap};
 return{lv:1,act:'OK',why:`${n.fill}% full · holds ~${cap} mm more`,state:'OK',cap};
}

let tab='todo',open=null;
const todo=()=>S.nets.map(n=>({n,a:assess(n)})).filter(x=>x.a.lv>=2).sort((x,y)=>y.a.lv-x.a.lv||(y.n.fill||0)-(x.n.fill||0));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}

function render(){
 const s=stormDay();
 $('#rain').innerHTML=`Rain next 3 days <b>${rainTotal()} mm</b> · heaviest <b>${nice(s.d)}</b> ${s.mm} mm`;
 $('#src').textContent=RAIN.live?'Rain: Open-Meteo, live':'Rain: demo values';
 const openWO=S.wos.filter(w=>w.status==='Open').length;
 const T=[['todo','To do',todo().length],['all','All nets',S.nets.length],['wo','Work orders',openWO],['done','Done',S.log.length]];
 $('#tabs').innerHTML=T.map(([k,l,c])=>`<button data-t="${k}" class="${tab===k?'on':''}">${l}<span class="n">${c}</span></button>`).join('');
 const v=$('#view');
 if(open){v.innerHTML=detail(S.nets.find(n=>n.id===open));return}
 if(tab==='todo'){const L=todo();v.innerHTML=L.length?`<div class="list">${L.map(card).join('')}</div>`:`<div class="empty">Nothing needs action.</div>`}
 if(tab==='all'){const L=S.nets.map(n=>({n,a:assess(n)})).sort((x,y)=>y.a.lv-x.a.lv||(y.n.fill||0)-(x.n.fill||0));v.innerHTML=`<div class="list">${L.map(card).join('')}</div>`}
 if(tab==='wo'){const L=S.wos.filter(w=>w.status==='Open');v.innerHTML=L.length?`<div class="list">${L.map(woCard).join('')}</div>`:`<div class="empty">No open work orders.</div>`}
 if(tab==='done'){v.innerHTML=S.log.length?`<div class="list">${S.log.slice().reverse().map(l=>`<div class="wo"><div class="row"><b>${esc(l.site)}</b><span class="no">${esc(l.no)} · ${nice(l.date)}</span></div><span>${esc(l.text)}</span></div>`).join('')}</div>`:`<div class="empty">Completed work appears here.</div>`}
}
function card({n,a}){return`<button class="item lv${a.lv}" data-o="${n.id}"><img src="img/${n.id}.jpg" alt=""><div><b>${esc(n.name)}</b><span>${esc(a.why||a.state)}</span></div><div class="act">${esc(a.act)}</div></button>`}
function woCard(w){return`<div class="wo"><div class="row"><b>${esc(w.site)}</b><span class="no">${w.no}</span></div><span>${esc(w.task)} · ${w.priority} · due ${nice(w.due)}</span><div class="btns"><button class="btn pri" data-done="${w.no}">Record completion</button><button class="btn quiet" data-copy="${w.no}">Copy</button></div><div id="f-${w.no}"></div></div>`}
function detail(n){
 const a=assess(n),img=n.big||`img/${n.id}.jpg`;
 const mark=n.mark?`<svg viewBox="0 0 100 75" preserveAspectRatio="none"><ellipse cx="${n.mark[0]}" cy="${n.mark[1]}" rx="10" ry="13" fill="none" stroke="#ff3b3b" stroke-width=".9"/></svg>`:'';
 const acts=a.lv>=2?`<button class="btn pri" data-raise="${n.id}">Raise work order</button><button class="btn" data-inspect="${n.id}">Send inspector</button><button class="btn quiet" data-defer="${n.id}">Defer 7 days</button>`:'';
 return`<button class="back" data-back>← Back</button><div class="sheet"><div class="fig"><div class="fw"><img src="${img}" alt="Latest camera image, ${esc(n.name)}">${mark}</div></div><div class="body">
 <div class="ttl"><h2>${esc(n.name)}</h2><span class="tag lv${a.lv}">${esc(a.state)}</span></div>
 ${a.lv>=2?`<div><b>${esc(a.act)}</b> · ${esc(a.why)}</div>`:''}
 <dl><dt>Fill</dt><dd>${n.fill==null?'Unknown':n.fill+'%'}${n.fill!=null?`<div class="meter"><i style="width:${n.fill}%"></i></div>`:''}</dd>
 <dt>Holds</dt><dd>${a.cap!=null?'~'+a.cap+' mm more rain':'—'}</dd>
 <dt>Forecast</dt><dd>${RAIN.days.map(x=>short(x.d)+' '+x.mm+' mm').join(' · ')}</dd>
 <dt>Last cleaned</dt><dd>${nice(n.last)}</dd></dl>
 <div class="btns">${acts}</div><div id="wo-out"></div></div></div>`;
}
function woText(w){return`WORK ORDER ${w.no}
Site: ${w.site}
Asset: End-of-pipe litter net (GPT)
Task: ${w.task}
Priority: ${w.priority}
Complete by: ${nice(w.due)}
Reason: ${w.reason}
Photo: latest camera frame, ${nice(w.created)}
Raised by: Stormwater officer, City of Parramatta`}
function raise(id,kind){
 const n=S.nets.find(x=>x.id===id),a=assess(n);
 const no='WO-'+String(TODAY.getFullYear()).slice(2)+'-'+String(S.seq++).padStart(4,'0');
 const task=kind==='inspect'?'Inspect net and camera':a.task;
 const due=a.lv===3||kind==='inspect'?iso(D(2)):stormDay().d<iso(D(1))?iso(D(1)):(()=>{const x=P(stormDay().d);x.setDate(x.getDate()-1);return iso(x)})();
 const w={no,net:id,site:n.name,task,priority:a.lv===3?'Urgent':'High',due,created:iso(TODAY),reason:a.why,status:'Open'};
 S.wos.push(w);save();
 $('#wo-out').innerHTML=`<pre>${esc(woText(w))}</pre><div class="btns"><button class="btn pri" data-copy="${no}">Copy work order</button><button class="btn quiet" data-back>Done</button></div>`;
 $('#wo-out').scrollIntoView({behavior:'smooth',block:'nearest'});
 document.querySelectorAll('[data-raise],[data-inspect],[data-defer]').forEach(b=>b.disabled=true);
}
function complete(no){
 $('#f-'+no).innerHTML=`<form class="form" data-f="${no}"><label>Removed (kg)<input id="kg-${no}" type="number" min="0" value="60"></label><label>Net after visit<select id="st-${no}"><option>Emptied, net intact</option><option>Repaired or replaced</option><option>Camera view cleared</option><option>No action needed</option></select></label><button class="btn pri">Close work order</button></form>`;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.t){tab=d.t;open=null;render()}
 else if(d.o){open=d.o;render();window.scrollTo(0,0)}
 else if('back' in d){open=null;render()}
 else if(d.raise)raise(d.raise,'clean');
 else if(d.inspect)raise(d.inspect,'inspect');
 else if(d.defer){const n=S.nets.find(x=>x.id===d.defer);n.defer=iso(D(7));save();open=null;render();toast('Deferred 7 days')}
 else if(d.copy){const w=S.wos.find(x=>x.no===d.copy);const txt=woText(w);
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Copied '+w.no)).catch(()=>toast('Select the text to copy'))}
 else if(d.done)complete(d.done);
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();
 const no=f.dataset.f,w=S.wos.find(x=>x.no===no),n=S.nets.find(x=>x.id===w.net);
 const kg=+document.getElementById('kg-'+no).value||0,st=document.getElementById('st-'+no).value;
 w.status='Closed';
 if(st!=='No action needed'){n.fill=st==='Camera view cleared'?n.fill??30:5;n.damaged=false;n.blind=0;if(st!=='Camera view cleared')n.last=iso(TODAY)}
 if(n.fill==null)n.fill=30;
 S.log.push({no,site:w.site,date:iso(TODAY),text:`${w.task} · ${st}${kg?` · ${kg} kg removed`:''}`});
 save();render();toast(no+' closed');
});
$('#reset').onclick=()=>{S=fresh();save();tab='todo';open=null;render();toast('Demo reset')};
render();getRain();
</script>
</body>
</html>
